# 台本から動画を1本作り、Release に置く。
#
# 動画は 1GB を超えるので、リポジトリには入れられない（1ファイル100MBまで）。
# git の履歴は消せないため、入れてしまうと以後 clone のたびに毎回ついてくる。
# Release の添付なら 1ファイル2GB まで載り、履歴には残らない。
#
# 実行: Actions タブ -> Make video -> Run workflow
name: Make video

on:
  workflow_dispatch:
    inputs:
      script:
        description: "台本のファイル。drafts/ を見て選ぶ"
        required: true
        # 既定は、題材の検討（Issue #1）で選ばれて書かせた台本にしておく。
        # 別の題材が既定だと、欄をそのままにした実行が1時間半かけて
        # 見たかったものと違う動画を作る。
        default: drafts/oparts_approved.txt
      name:
        description: "出力名（空でよい。台本のファイル名から決まる）"
        required: false
        default: ""
      voice:
        description: ElevenLabs の voice_id。空なら無音で作る
        required: false
        default: ss9cJxDAEMXP4wfQ3GPr
      claims:
        description: 取り上げる主張の数
        required: false
        default: "5"
      broll:
        description: 繰り返す区間にCommonsのイメージ映像を入れる
        type: boolean
        default: true
      generate_images:
        description: 残った繰り返しを生成画像で埋める
        type: boolean
        default: true
      bgm:
        description: BGM（video/public/ 以下）。空なら無音
        required: false
        default: bgm.mp3

# Release を作るために書き込みが要る
permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    # 素材集め・生成・読み上げ・描画で1時間半ほどかかる
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: video/package-lock.json

      - run: pip install -r requirements.txt

      # 台本でないファイル（判定・設計図）を渡されたら、23分の描画に入る前に止める
      - name: 台本かどうか確かめる
        run: python3 -m script_engine.guard "${{ inputs.script }}"

      # 日本語のフォントが無いと、字幕もカードも豆腐（□）になる。
      # ランナーには入っていないので必ず入れる。実測で本編まるごと
      # 読めない状態で出来上がった。
      - name: ffmpeg と日本語フォントを入れる
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-cjk fonts-noto-cjk-extra
          fc-cache -f
          ffmpeg -version | head -1
          echo "日本語フォント: $(fc-list :lang=ja family | wc -l)種"
          fc-list :lang=ja family | head -3

      - name: node の依存を入れる
        run: npm ci --prefix video

      # 描画用のブラウザは200MB近くある。毎回取り直すと時間を食う
      - name: ブラウザの控えを使う
        uses: actions/cache@v4
        with:
          path: video/node_modules/.remotion
          key: remotion-browser-${{ runner.os }}-${{ hashFiles('video/package-lock.json') }}

      - name: 描画用のブラウザを確かめる
        run: npx --prefix video remotion browser ensure

      # 90分かけてから設定の不備で落ちるのを防ぐ。ここで落ちれば数分で分かる
      - name: 1枚だけ描いて設定を確かめる
        run: |
          python3 video/build_props.py "${{ inputs.script }}" \
            --duration 60 --kind bundle --claims 1 --out video/_smoke.json
          cd video && PROPS=_smoke.json ./render.sh still Documentary \
            /tmp/smoke.png --frame=30
          ls -lh /tmp/smoke.png
          cd .. && python3 video/check_frame.py /tmp/smoke.png

      # 出力名は先に決める。動画づくりの中で決めていたので、途中で落ちると
      # 後段の名前が空になり、成果物が「-8」になった（#8）
      - name: 出力名を決める
        run: |
          name="${{ inputs.name }}"
          [ -n "$name" ] || name=$(basename "${{ inputs.script }}" .txt | sed 's/_v[0-9]*$//')
          echo "NAME=$name" >> $GITHUB_ENV
          echo "出力名: $name"

      # 合成済みの読み上げの控え。クレジットが途中で尽きて落ちても、足して再実行すれば
      # 足りなかった塊だけ払えばよい（#8 はそれまでの約4,400クレジット分を捨てた）
      - name: 読み上げの控えを戻す
        uses: actions/cache/restore@v4
        with:
          path: .cache/tts
          key: tts-${{ github.run_id }}
          restore-keys: tts-

      - name: 動画を作る
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
        run: |
          args=(--claims "${{ inputs.claims }}")
          [ -n "${{ inputs.name }}" ] && args+=(--name "${{ inputs.name }}")
          [ -n "${{ inputs.voice }}" ] && args+=(--voice "${{ inputs.voice }}")
          [ -n "${{ inputs.bgm }}" ] && args+=(--bgm "${{ inputs.bgm }}")
          [ "${{ inputs.broll }}" = "true" ] && args+=(--broll)
          [ "${{ inputs.generate_images }}" = "true" ] && args+=(--generate-images)
          python3 make.py "${{ inputs.script }}" "${args[@]}"

      # 落ちても控えは残す（成功したときだけ残す既定だと、途中まで払った分が消える）
      - name: 読み上げの控えを残す
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .cache/tts
          key: tts-${{ github.run_id }}

      - name: 出来たものを確認する
        run: |
          ls -lh "out/$NAME.mp4"
          ffprobe -v error -show_entries format=duration -of csv=p=0 \
            "out/$NAME.mp4"

      # Release に置く。添付は履歴に残らないので、リポジトリは重くならない
      # Release が失敗しても取り出せるようにしておく
      - name: 成果物としても残す
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.NAME }}-${{ github.run_number }}
          path: |
            out/${{ env.NAME }}.mp4
            out/${{ env.NAME }}_description.txt
            out/${{ env.NAME }}_titles.txt
            video/public/shots_${{ env.NAME }}/credits.txt
            video/props_${{ env.NAME }}.json
          retention-days: 30
          if-no-files-found: warn

      - name: Release に置く
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.NAME }}-${{ github.run_number }}
          name: ${{ env.NAME }}（自動生成 #${{ github.run_number }}）
          body: |
            台本 `${{ inputs.script }}` から自動生成。

            - 声: `${{ inputs.voice }}`
            - 画像生成: `${{ inputs.generate_images }}`
            - BGM: `${{ inputs.bgm }}`

            **`<名前>_description.txt` をそのままYouTubeの概要欄に貼ってください。**
            章の時刻（目次）と画像の出典が入っています。章は読み上げの実時間
            から取っているので、動画と一致します。出典はCC BYの表示義務を
            満たすために必要です。生成画像が含まれる場合、その申告も入ります。
          files: |
            out/${{ env.NAME }}.mp4
            out/${{ env.NAME }}_description.txt
            out/${{ env.NAME }}_titles.txt
            video/public/shots_${{ env.NAME }}/credits.txt
