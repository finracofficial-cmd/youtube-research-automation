- ja: 聖書から消えた記述が死海文書に残っている
  en: Dead Sea Scrolls missing Bible passages apocrypha comparison
  told_by: YouTube解説 / 書籍
  stakes: 聖書の内容が意図的に編集されたかどうかが問われ、信仰や歴史認識に影響を与える。
- ja: AI解析で未発見の文が死海文書に見つかった
  en: AI analysis Dead Sea Scrolls new unrecovered text reconstruction
  told_by: YouTube解説 / ニュース
  stakes: 最新技術で未知の内容が発見されれば、歴史の常識が覆るかもしれない。
- ja: 死海文書に救世主の正体が書かれている
  en: Dead Sea Scrolls Messianic figure identity Messiah prophecy
