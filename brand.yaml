# チャンネルの看板。概要欄はここから組む（publish.py）。
#
# 参考ch「大人の自由研究」(@otonano-jiyukenkyu) の実測:
#   登録 11,500 / 動画3本 / ヴォイニッチ手稿回 140万再生・52分
#   売りは「論文・一次資料・自作シミュレーション」。題材の条件は
#   「まだ答えが出ていない」か「通説が間違っている」のどちらか。
#   出典を毎回概要欄に載せ、怪しい資料は怪しいと書く。
#
# こちらが真似できない点: 向こうは1本に数十時間かけて不定期。
# こちらは2日に1本。だから看板は「時間をかけた」ではなく
# 「出典を必ず示す」に置く。そこは実際に仕組みで担保している。

name: 出典のある話
handle: shutten-no-aru-hanashi

# 概要欄の先頭。毎回同じ文が入る。
lead: |
  古代の謎と都市伝説を、論文と一次資料で確かめています。
  この動画で使った資料は、下にすべて載せています。

# チャンネル説明（YouTubeの「概要」欄）。
about: |
  「ピラミッドは人力では作れない」「モアイは歩いた」
  ——こうした話を、面白いまま終わらせずに、出典まで辿ります。

  扱うのは、次のどちらかに当てはまる題材だけです。
  ・まだ答えが出ていない
  ・広まっている説が、資料と食い違う

  各動画の概要欄に、使った論文と資料のリンクをすべて載せています。
  資料が薄いときは、薄いと書きます。否定も肯定もせず、
  どこまで分かっていて、どこから分かっていないのかを示します。

  扱ってほしい題材があれば、コメント欄でご提案ください。

# YouTubeは先頭3つを題名の上に出す。題材固有のものを先頭に置く。
hashtags:
  - 都市伝説
  - 一次資料
  - 未解決ミステリー
