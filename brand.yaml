# チャンネルの看板。概要欄はここから組む（publish.py）。
#
# 参考ch「大人の自由研究」(@otonano-jiyukenkyu) の実測:
#   登録 11,500 / 動画3本 / ヴォイニッチ手稿回 140万再生・52分
#   同じ棚に「ヴォイニッチ手稿」と「橋本環奈の息分子」が並んでいる。
#   知的好奇心で見に来る層は同じなので、題材の幅は問題にならない。
#
# こちらの既存ch「余計な解剖学」(@yokei_kaibou) の実測:
#   登録 31 / 動画10本 / 中央値207再生・最高497再生
#   10本すべてが「身近な疑問」枠。参考chで同じ枠は1.3万再生で一番弱い。
#   未解読・未解決の枠へ寄せる。

name: 余計な解剖学
handle: yokei_kaibou

# 概要欄の先頭。毎回同じ文が入る。
lead: |
  一度気づくと気になってしまう疑問を、論文と一次資料で解剖しています。
  この動画で使った資料は、下にすべて載せています。

# チャンネル説明（YouTubeの「概要」欄）。
about: |
  気にしなければ済むのに、一度気づくと気になってしまう。
  そういう疑問を、論文と一次資料で最後まで解剖します。

  扱うのは二種類だけです。
  ・まだ誰も答えを出していないもの
  ・広く信じられている説が、資料と食い違っているもの

  ヴォイニッチ手稿、オーパーツ、古代の巨石、未解読の文字。
  神経科学、行動経済学、進化生物学、制度史。
  その疑問に効くものなら分野は選びません。

  使った論文と資料は、毎回すべて概要欄に載せます。
  資料が薄いときは、薄いと書きます。
  否定も肯定もせず、どこまで分かっていて、
  どこから分かっていないのかを示します。

  ※内容に誤りがあった場合は、コメント欄でご指摘ください。
  　確認のうえ、概要欄または固定コメントにて訂正します。

# チャンネルのキーワード（YouTube Studio > 設定 > チャンネル > キーワード）。
# カンマ区切り20個。# は付けない。
keywords:
  - 未解決ミステリー
  - 一次資料
  - 論文
  - 検証
  - 古代文明
  - 考古学
  - 古代史
  - オーパーツ
  - ヴォイニッチ手稿
  - 未解読文字
  - 都市伝説
  - 歴史ミステリー
  - 解説
  - 考察
  - 教養
  - 知的好奇心
  - 雑学
  - 大人の学び直し
  - 科学
  - ドキュメンタリー

# 動画の概要欄に出すハッシュタグ。YouTubeは先頭3つを題名の上に出すので、
# 題材固有の語が先頭に来るよう publish.tags_for が組み替える。
hashtags:
  - 未解決ミステリー
  - 一次資料
  - 解説
